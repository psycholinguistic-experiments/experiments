    <link rel="stylesheet" href="assets/lab.css?v=9">
    <style>
        /* Chinese pages: quotation marks and CJK punctuation come from the system's Chinese font (full width), the rest from Open Sans. */
        @font-face { font-family: 'CJK Punct'; src: local('PingFang SC'), local('PingFangSC-Regular'), local('Noto Sans CJK SC'), local('Source Han Sans SC'), local('Microsoft YaHei'); unicode-range: U+2018-2019, U+201C-201D, U+2026, U+3000-303F, U+FF01-FF1F; }
        html:lang(zh-Hans) body { font-family: 'CJK Punct', 'Open Sans', var(--font-hans), sans-serif; }
        .report-text, legend, .lead { text-wrap: pretty; }
        fieldset.missing legend { color: var(--danger); }
        fieldset.missing .choice > span, .prof-row.missing .choice > span { border-color: var(--danger); }
        .prof-row.missing .prof-skill { color: var(--danger); }
        .report-lead { font-weight: 650; color: var(--text); margin: 0; }
        .report-text { margin: 0.9rem 0 0; padding: 1.1rem 1.25rem; border-left: 3px solid var(--text); background: var(--bg-alt); font-size: 1.08rem; line-height: 1.7; color: var(--text); }
        .report-text strong { font-weight: 750; }
        :lang(zh) .report-text { line-height: 1.85; }
    </style>
</head>
