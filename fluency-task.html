<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>词语任务 · LT5461</title>
    <meta name="description" content="An in-class task for LT5461 at City University of Hong Kong.">
    <link rel="preload" href="assets/fonts/OpenSans-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/lab.css?v=9">
    <style>
        /* Chinese page: CJK punctuation from the system's Chinese font (full width), Latin and digits from Open Sans. */
        @font-face { font-family: 'CJK Punct'; src: local('PingFang SC'), local('PingFangSC-Regular'), local('Noto Sans CJK SC'), local('Source Han Sans SC'), local('Microsoft YaHei'); unicode-range: U+2018-2019, U+201C-201D, U+2026, U+3000-303F, U+FF01-FF1F; }
        html:lang(zh-Hans) body { font-family: 'CJK Punct', 'Open Sans', var(--font-hans), sans-serif; }
        .lead, legend { text-wrap: pretty; }
        .part-label { margin: 0 0 0.35rem; font-size: 0.9rem; font-weight: 650; letter-spacing: 0.04em; color: var(--text-secondary); }
        fieldset.missing legend { color: var(--danger); }
        fieldset.missing .choice > span { border-color: var(--danger); }

        /* The fluency block: the category, a count and the clock in one row; a draining bar; the box; the words so far. */
        .flu-bar { display: flex; align-items: baseline; gap: 0.5rem 1.25rem; }
        .flu-cat { margin: 0 auto 0 0; font-size: 1.6rem; }
        .flu-count { color: var(--text-secondary); font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .flu-timer { font-size: 1.6rem; font-weight: 750; font-variant-numeric: tabular-nums; color: var(--text); min-width: 3.4ch; text-align: right; }
        .flu-timer.low { color: var(--danger); }
        .flu-track { height: 4px; margin: 0.6rem 0 1.1rem; background: var(--border); border-radius: 2px; overflow: hidden; }
        .flu-track span { display: block; height: 100%; background: var(--text); transform-origin: left; transition: transform 0.2s linear; }
        @media (prefers-reduced-motion: reduce) { .flu-track span { transition: none; } }
        .flu-form { display: flex; gap: 0.6rem; }
        .flu-form .btn { margin: 0; flex: none; }
        .flu-input { flex: 1; min-width: 0; font: inherit; font-size: 1.25rem; padding: 0.6rem 0.8rem; min-height: 3rem; color: var(--text); background: var(--bg); border: 1.5px solid var(--border-input); border-radius: 4px; }
        .flu-input:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-color: var(--text); }
        .flu-input:disabled { background: var(--bg-alt); }
        .flu-msg { min-height: 1.5rem; margin: 0.6rem 0 0; font-weight: 650; color: var(--text); }
        .flu-list { list-style: none; margin: 0.4rem 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.45rem; max-height: 40vh; overflow-y: auto; align-content: flex-start; }
        .flu-list li { padding: 0.25rem 0.65rem; border: 1px solid var(--border-strong); border-radius: 999px; font-size: 1.02rem; line-height: 1.4; color: var(--text); background: var(--bg); }
        .flu-list li.repeat { color: var(--text-light); border-style: dashed; }
        .flu-next .actions { margin-top: 1.25rem; }

        /* The questionnaire: the seven labels once at the top, then the ten statements. */
        .scale-key { list-style: none; margin: 1rem 0 0.5rem; padding: 0.75rem 1rem; background: var(--bg-alt); border-radius: 4px; display: grid; gap: 0.2rem; font-size: 0.95rem; color: var(--text-secondary); }
        .scale-key b { display: inline-block; min-width: 1.4rem; color: var(--text); font-variant-numeric: tabular-nums; }
        fieldset.item legend { font-weight: 650; color: var(--text); line-height: 1.6; }
        .item-n { display: inline-block; min-width: 1.8rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <header class="masthead">
        <div class="masthead-inner">
            <a class="brand" href="./">LT5461</a>
            <span class="masthead-meta">词语任务</span>
        </div>
    </header>

    <main id="main">
        <section class="screen page" id="s-intro"></section>
        <section class="screen page" id="s-part" hidden></section>
        <section class="screen page" id="s-flu" hidden></section>
        <section class="screen page" id="s-scale" hidden></section>
        <section class="screen page" id="s-done" hidden></section>
    </main>

    <footer class="footer">
        <div class="page">LT5461</div>
    </footer>

    <script src="assets/config.js?v=2"></script>
    <script src="assets/lab.js?v=10"></script>
    <script src="assets/fluency.js?v=1"></script>
</body>
</html>
