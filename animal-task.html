<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Animal task · LT5461</title>
    <meta name="description" content="An in-class task for LT5461 at City University of Hong Kong.">
    <link rel="preload" href="assets/fonts/OpenSans-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/lab.css?v=9">
    <style>
        /* Part 1: the arrangement box fills the screen below the instructions. */
        .arrange-wrap { max-width: 72rem; margin: 0 auto; padding: 0.75rem 1rem 0; }
        .arrange-bar { display: flex; align-items: center; gap: 0.5rem 1rem; margin: 0 0 0.6rem; font-variant-numeric: tabular-nums; color: var(--text-secondary); font-weight: 600; }
        .arrange-h { font-size: 1.05rem; margin: 0 auto 0 0; color: var(--text); }
        .arrange-bar .btn { margin: 0; }
        #moved-count, .arrange-h { white-space: nowrap; }
        @media (max-width: 420px) { .arrange-bar { gap: 0.5rem; font-size: 0.88rem; } .arrange-h { font-size: 0.9rem; } .arrange-bar .btn { padding-left: 0.9rem; padding-right: 0.9rem; } }
        .arena { position: relative; width: 100%; height: 520px; border: 1.5px solid var(--border-input); border-radius: 4px; background: var(--bg); touch-action: none; overflow: hidden; }
        .animal { position: absolute; transform: translate(-50%, -50%); padding: 0.32rem 0.6rem; min-height: 2rem; font: inherit; font-size: 0.95rem; font-weight: 650; line-height: 1.2; white-space: nowrap;
            color: var(--text); background: var(--bg); border: 1.5px solid var(--text); border-radius: 4px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
        .animal.unmoved { border-style: dashed; border-color: var(--text-light); color: var(--text-secondary); background: var(--bg-alt); }
        .animal.selected { background: var(--text); color: var(--bg); border-style: solid; border-color: var(--text); }
        .animal.dragging { cursor: grabbing; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18); }
        .animal:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
        @media (max-width: 560px) { .animal { font-size: 0.86rem; padding: 0.28rem 0.45rem; } }
        .confirm { margin: 0.75rem 0 1rem; }
        .confirm .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.5rem; margin-top: 0.5rem; }
        /* Part 2: one question and a 0–100% slider. */
        .item-q { font-size: 1.2rem; font-weight: 650; color: var(--text); line-height: 1.5; margin: 0.5rem 0 0; text-wrap: pretty; }
        .infer-help { color: var(--text-secondary); margin: 0.9rem 0 0; text-wrap: pretty; }
        .slider { margin: 2rem 0 0; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0.5rem 1rem; }
        .slider .scale-ends { grid-column: 1 / -1; margin-top: 0; font-size: 0.86rem; color: var(--text-secondary); }
        .slider output { font-weight: 750; font-size: 1.15rem; font-variant-numeric: tabular-nums; min-width: 3.2rem; text-align: right; color: var(--text); }
        input[type=range] { width: 100%; height: 2.75rem; margin: 0; background: transparent; accent-color: var(--text); cursor: pointer; }
        input[type=range]:focus-visible { outline: 2px solid var(--text); outline-offset: 4px; }
    </style>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="masthead">
        <div class="masthead-inner">
            <a class="brand" href="./">LT5461</a>
            <span class="masthead-meta">Animal task</span>
        </div>
    </header>

    <main id="main">
        <section class="screen page" id="s-intro"></section>
        <section class="screen page" id="s-part" hidden></section>
        <section class="screen" id="s-arrange" hidden></section>
        <section class="screen page" id="s-infer" hidden></section>
        <section class="screen page" id="s-final" hidden></section>
        <section class="screen page" id="s-done" hidden></section>
    </main>

    <footer class="footer">
        <div class="page">LT5461</div>
    </footer>

    <script src="assets/config.js?v=2"></script>
    <script src="assets/lab.js?v=10"></script>
    <script src="assets/animal-items.js?v=1"></script>
    <script src="assets/animals.js?v=3"></script>
</body>
</html>
