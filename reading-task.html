<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Reading task · LT5461</title>
    <meta name="description" content="An in-class reading task for LT5461 at City University of Hong Kong.">
    <link rel="preload" href="assets/fonts/OpenSans-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/lab.css?v=9">
    <style>
        kbd { font: 600 0.86em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0.05rem 0.4rem; color: var(--text); background: var(--bg); }
        /* The trial: a thin progress line, the stage, and (for touch) the buttons under it. */
        .rt { max-width: 52rem; }
        .rt-top { display: flex; align-items: center; gap: 1rem; font-size: 0.88rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
        .rt-top #r-progress { white-space: nowrap; min-width: 8.5rem; }
        .rt-track { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
        .rt-track span { display: block; height: 100%; background: var(--text-secondary); transform-origin: left; transform: scaleX(0); }
        .rt-stage { min-height: 15rem; margin: 2.5rem 0 1.5rem; display: flex; flex-direction: column; justify-content: center; }
        .rt-stage.reading { justify-content: flex-start; }
        /* Monospaced text: a word and its dashes take the same width, so nothing moves. The shown word changes colour only (no bold). */
        .rt-line { font: 1.32rem/2.1 ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; color: var(--text-light); margin: 0; letter-spacing: 0; word-spacing: 0.1em; }
        .rt-line span.on { color: var(--text); }
        .rt-line2 { margin-top: 1.5rem; }
        .rt-ready, .rt-q, .rt-keys { color: var(--text-secondary); margin: 0.4rem 0; }
        .rt-probe { font: 600 2.1rem/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text); margin: 1rem 0; }
        .rt-question { font-size: 1.35rem; line-height: 1.5; color: var(--text); margin: 0 0 0.75rem; text-wrap: pretty; }
        .rt-h { font-size: 1.4rem; margin: 0 0 0.5rem; }
        .rt-tap { display: flex; flex-wrap: wrap; gap: 0.6rem; }
        .rt-tap .btn { margin: 0; }
        .btn-secondary { background: var(--bg); color: var(--text); border: 1.5px solid var(--border-input); }
        @media (hover: hover) and (pointer: fine) { .rt-tap .btn { opacity: 0.75; } }
        @media (max-width: 560px) { .rt-line { font-size: 1.02rem; } .rt-probe { font-size: 1.6rem; } }
    </style>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="masthead">
        <div class="masthead-inner">
            <a class="brand" href="./">LT5461</a>
            <span class="masthead-meta">Reading task</span>
        </div>
    </header>

    <main id="main">
        <section class="screen page" id="s-intro"></section>
        <section class="screen page" id="s-trial" hidden></section>
        <section class="screen page" id="s-done" hidden></section>
    </main>

    <footer class="footer">
        <div class="page">LT5461</div>
    </footer>

    <script src="assets/config.js?v=2"></script>
    <script src="assets/lab.js?v=10"></script>
    <script src="assets/reading-core.js?v=1"></script>
    <script src="assets/reading.js?v=1"></script>
</body>
</html>
